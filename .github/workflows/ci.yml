name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        env:
          # Placeholder public values so `next build` can succeed in CI without real secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          NEXT_PUBLIC_SUBMIT_LEAD_URL: https://example.supabase.co/functions/v1/submit-lead
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-turnstile-site-key
          NEXT_PUBLIC_SITE_URL: https://www.apexunion.com
        run: npm run build
