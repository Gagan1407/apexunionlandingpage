name: Docker

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (lowercase)
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve public build args
        id: buildargs
        env:
          S_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          S_ANON: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          S_SUBMIT: ${{ secrets.NEXT_PUBLIC_SUBMIT_LEAD_URL }}
          S_TURNSTILE: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          S_SITE: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          # Prefer repo secrets on prod; fall back to placeholders for PR/dev CI.
          echo "supabase_url=${S_URL:-https://example.supabase.co}" >> "$GITHUB_OUTPUT"
          echo "anon_key=${S_ANON:-ci-anon-key}" >> "$GITHUB_OUTPUT"
          echo "submit_url=${S_SUBMIT:-https://example.supabase.co/functions/v1/submit-lead}" >> "$GITHUB_OUTPUT"
          echo "turnstile=${S_TURNSTILE:-ci-turnstile-site-key}" >> "$GITHUB_OUTPUT"
          echo "site_url=${S_SITE:-https://www.apexunion.com}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}

      - name: Build (load always; push on prod)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ steps.buildargs.outputs.supabase_url }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ steps.buildargs.outputs.anon_key }}
            NEXT_PUBLIC_SUBMIT_LEAD_URL=${{ steps.buildargs.outputs.submit_url }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ steps.buildargs.outputs.turnstile }}
            NEXT_PUBLIC_SITE_URL=${{ steps.buildargs.outputs.site_url }}

      - name: Smoke-test /api/health
        run: |
          set -euo pipefail
          # Prefer the sha tag from metadata; fall back to first tag line.
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | grep -E ':[0-9a-f]{7}$' | head -n1 || true)
          if [ -z "$IMAGE" ]; then
            IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          fi
          echo "Running smoke test against $IMAGE"
          docker run -d --name apex-ci -p 3000:3000 "$IMAGE"
          trap 'docker rm -f apex-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          docker logs apex-ci || true
          echo "Health check failed"
          exit 1
