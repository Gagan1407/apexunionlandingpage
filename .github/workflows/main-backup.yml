name: Main backup check

# main holds the original/backup codebase (currently the pre-Next static site).
# Only run a Node build when package.json exists.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: main-backup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-build:
    name: Backup branch check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect project type
        id: kind
        run: |
          if [ -f package.json ]; then
            echo "type=next" >> "$GITHUB_OUTPUT"
          else
            echo "type=static" >> "$GITHUB_OUTPUT"
          fi

      - name: Static backup present
        if: steps.kind.outputs.type == 'static'
        run: |
          echo "main is a static backup (no package.json). Skipping Node build."
          ls -la

      - uses: actions/setup-node@v4
        if: steps.kind.outputs.type == 'next'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install & verify Next app
        if: steps.kind.outputs.type == 'next'
        run: |
          npm ci
          npm run typecheck
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          NEXT_PUBLIC_SUBMIT_LEAD_URL: https://example.supabase.co/functions/v1/submit-lead
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-turnstile-site-key
          NEXT_PUBLIC_SITE_URL: https://www.apexunion.com
