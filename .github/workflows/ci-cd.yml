name: CI/CD

# Single pipeline — cPanel Git™ Version Control + SSH (port 1012).
#
# Branch model:
#   dev  → commit here
#   prod → live production (cPanel tracks this branch)
#   main → backup of production
#
# Flow: push to dev → lint + typecheck + build → promote to prod + main
#       → SSH pull prod on cPanel and run deploy (.cpanel.yml / uapi).
#
# Required GitHub secrets:
#   CPANEL_SSH_HOST
#   CPANEL_SSH_USER
#   CPANEL_SSH_PRIVATE_KEY
#   CPANEL_REMOTE_PATH          e.g. /home/USER/apex-web
# Optional:
#   CPANEL_SSH_PORT             default 1012
#   CPANEL_DEPLOY_CMD           override remote deploy command
#   PROMOTE_TOKEN               PAT if prod/main are branch-protected
#   NEXT_PUBLIC_*               real build values (else CI placeholders)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUBMIT_LEAD_URL: ${{ secrets.NEXT_PUBLIC_SUBMIT_LEAD_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL:-https://example.supabase.co}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY:-ci-anon-key}"
          export NEXT_PUBLIC_SUBMIT_LEAD_URL="${NEXT_PUBLIC_SUBMIT_LEAD_URL:-https://example.supabase.co/functions/v1/submit-lead}"
          export NEXT_PUBLIC_TURNSTILE_SITE_KEY="${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-ci-turnstile-site-key}"
          export NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://www.apexunion.com}"
          npm run build

  promote:
    name: Promote dev → prod + main
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN || github.token }}

      - name: Push same commit to prod and main
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "Promoting $SHA → origin/prod and origin/main"
          # force-with-lease keeps prod/main identical to the tested dev tip
          # without clobbering unexpected remote updates.
          git push --force-with-lease origin "HEAD:prod"
          git push --force-with-lease origin "HEAD:main"
          echo "Promote complete."

  deploy:
    name: Deploy on cPanel (SSH :1012)
    needs: promote
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "Missing CPANEL_SSH_PRIVATE_KEY"; exit 1; }
          test -n "${SSH_HOST:-}" || { echo "Missing CPANEL_SSH_HOST"; exit 1; }
          SSH_PORT="${SSH_PORT:-1012}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Pull prod and deploy
        env:
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.CPANEL_REMOTE_PATH }}
          DEPLOY_CMD: ${{ secrets.CPANEL_DEPLOY_CMD }}
        run: |
          set -euo pipefail
          test -n "${SSH_USER:-}" || { echo "Missing CPANEL_SSH_USER"; exit 1; }
          test -n "${REMOTE_PATH:-}" || { echo "Missing CPANEL_REMOTE_PATH"; exit 1; }
          SSH_PORT="${SSH_PORT:-1012}"

          ssh -i ~/.ssh/cpanel_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            env REMOTE_PATH="$REMOTE_PATH" DEPLOY_CMD="${DEPLOY_CMD:-}" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_PATH"
          echo "=== cPanel deploy @ $(pwd) ==="
          git fetch origin
          git checkout prod
          git pull --ff-only origin prod
          echo "Now at $(git rev-parse --short HEAD) on $(git rev-parse --abbrev-ref HEAD)"

          if [ -n "${DEPLOY_CMD:-}" ]; then
            eval "$DEPLOY_CMD"
          elif command -v uapi >/dev/null 2>&1; then
            uapi VersionControlDeployment create repository_root="$REMOTE_PATH"
          else
            echo "uapi not found — running build equivalent to .cpanel.yml"
            APP_NAME="$(basename "$REMOTE_PATH")"
            NODE_BIN_DIR="/home/${USER}/nodevenv/${APP_NAME}/22/bin"
            if [ -d "$NODE_BIN_DIR" ]; then
              export PATH="$NODE_BIN_DIR:$PATH"
            fi
            if [ -f .env ]; then
              set -a
              # shellcheck disable=SC1091
              . ./.env
              set +a
            fi
            npm ci
            npm run build
            mkdir -p .next/standalone/.next
            rm -rf .next/standalone/.next/static
            cp -a .next/static .next/standalone/.next/static
            if [ -d public ]; then
              rm -rf .next/standalone/public
              cp -a public .next/standalone/public
            fi
            mkdir -p tmp
            touch tmp/restart.txt
          fi

          echo "=== Deploy finished ==="
          REMOTE
