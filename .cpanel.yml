---
# cPanel Git™ Version Control deploy hook
# Runs after Pull/Deploy (or when CI triggers VersionControlDeployment / equivalent).
#
# BEFORE FIRST DEPLOY — set NODE_BIN_DIR to your Node.js App virtualenv bin, e.g.:
#   /home/apexunion/nodevenv/apex-web/22/bin
#
# Set NEXT_PUBLIC_* + TURNSTILE_SECRET_KEY + LEAD_PROXY_SECRET in the
# Node.js App UI (or a server-side .env that is NOT in git).

deployment:
  tasks:
    - |
      set -euo pipefail
      echo "=== Apex Union cPanel deploy starting ==="
      echo "Branch: $(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)"
      echo "Commit: $(git rev-parse --short HEAD 2>/dev/null || echo unknown)"

      # >>> EDIT THIS if npm is not found <<<
      NODE_BIN_DIR="/home/apexunion/nodevenv/apex-web/22/bin"
      if [ -d "$NODE_BIN_DIR" ]; then
        export PATH="$NODE_BIN_DIR:$PATH"
      fi

      command -v node
      command -v npm
      node -v
      npm -v

      if [ -f .env ]; then
        set -a
        # shellcheck disable=SC1091
        . ./.env
        set +a
      fi

      npm ci
      npm run build

      # Standalone layout — Application startup file: .next/standalone/server.js
      mkdir -p .next/standalone/.next
      rm -rf .next/standalone/.next/static
      cp -a .next/static .next/standalone/.next/static
      if [ -d public ]; then
        rm -rf .next/standalone/public
        cp -a public .next/standalone/public
      fi

      mkdir -p tmp
      touch tmp/restart.txt

      echo "=== Deploy finished ==="
