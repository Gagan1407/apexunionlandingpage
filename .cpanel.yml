---
# cPanel Git™ Version Control deploy hook
# Runs after Pull/Deploy (or when CI triggers VersionControlDeployment / equivalent).
#
# This host exposes system Node at /bin (no Setup Node.js App / nodevenv).
# Set NEXT_PUBLIC_* + TURNSTILE_SECRET_KEY + LEAD_PROXY_SECRET in a server
# .env under the app root (never commit that file). Requires Node 22+.

deployment:
  tasks:
    - |
      set -euo pipefail
      echo "=== Apex Union cPanel deploy starting ==="
      echo "Branch: $(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)"
      echo "Commit: $(git rev-parse --short HEAD 2>/dev/null || echo unknown)"

      # System Node on this host (apexunion@india): /bin/node, /bin/npm
      export PATH="/bin:$PATH"

      command -v node
      command -v npm
      node -v
      npm -v

      if [ -f .env ]; then
        set -a
        # shellcheck disable=SC1091
        . ./.env
        set +a
      fi

      npm ci --include=dev
      npm run build

      # Standalone layout — Application startup file: .next/standalone/server.js
      mkdir -p .next/standalone/.next
      rm -rf .next/standalone/.next/static
      cp -a .next/static .next/standalone/.next/static
      if [ -d public ]; then
        rm -rf .next/standalone/public
        cp -a public .next/standalone/public
      fi
      if [ -f .env ]; then
        cp .env .next/standalone/.env
      fi

      mkdir -p tmp
      touch tmp/restart.txt

      # Keep PM2 process in sync when this hook runs
      if command -v pm2 >/dev/null 2>&1; then
        export PORT="${PORT:-3010}" HOSTNAME=0.0.0.0 NODE_ENV=production
        pm2 delete apexweb 2>/dev/null || true
        pm2 start "$(pwd)/.next/standalone/server.js" \
          --name apexweb \
          --cwd "$(pwd)/.next/standalone"
        pm2 save
      fi

      echo "=== Deploy finished ==="
